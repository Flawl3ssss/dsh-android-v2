name: payload
# Payload-3: DSH 0.1.7-alpha.1 (R-01) slim-install + stripped zen-adapter +
# payload.json v3 + sha256 → релиз payload-3. Ключей в payload нет (R-07).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Slim-install DSH 0.1.7-alpha.1 (linux-arm64)
        run: |
          set -e
          rm -rf /tmp/pay3 && mkdir -p /tmp/pay3/profiles
          cd /tmp/pay3
          npm init -y > /dev/null 2>&1
          # ВАЖНО: раннер ubuntu x64 ставит x64-натив; чистим чужые prebuilds,
          # затем доставляем linux-arm64 натив (system/koffi/sharp/pty/sherpa).
          npm i --prefix /tmp/pay3/stage @deepseek-ai/dsh@0.1.7-alpha.1 --no-audit --no-fund 2>&1 | tail -n 3
          mkdir -p /tmp/pay3/profiles/node_modules
          cp -r /tmp/pay3/stage/node_modules/* /tmp/pay3/profiles/node_modules/
          # Натив: x64-раннер ставит optionalDeps только под x64 (остальные UNMET).
          # Доставляем arm64-варианты напрямую tarball'ами (npm install с --cpu/--os
          # здесь отказывает notsup, т.к. сам npm бежит на x64; прямые URL без проверок).
          ARM=/tmp/arm64pkgs && rm -rf $ARM && mkdir -p $ARM && cd $ARM
          for spec in \
            "@deepseek-ai/node-addon-system-linux-arm64@0.1.2" \
            "@koromix/koffi-linux-arm64@3.3.1" \
            "@img/sharp-linuxmusl-arm64@0.35.4" \
            "sherpa-onnx-linux-arm64@1.13.8" \
            "@vscode/ripgrep-linux-arm64@1.18.0" \
            "node-addon-require-builtin-linux-arm64-gnu@0.1.6"; do
            url=$(npm view "$spec" dist.tarball 2>/dev/null) || { echo "MISS view: $spec"; continue; }
            echo "fetch $spec -> $url"
            curl -fsSL "$url" -o pkg.tgz || { echo "MISS fetch: $spec"; continue; }
            dir="/tmp/pay3/profiles/node_modules/$(echo "$spec" | cut -d@ -f1-2 | cut -d@ -f2 | python3 -c 'import sys,json' 2>/dev/null || echo x)"
            # имя пакета = всё до @версии
            name="${spec%@*}"
            mkdir -p "/tmp/pay3/profiles/node_modules/$name"
            tar -xzf pkg.tgz -C "/tmp/pay3/profiles/node_modules/$name" --strip-components=1
            echo "installed $name"
          done
          cd /tmp/pay3/profiles
          # Удаляем x64-натив (на телефоне arm64 он мёртвый груз и ломает резолв).
          rm -rf /tmp/pay3/profiles/node_modules/@deepseek-ai/node-addon-system-linux-x64 \
            /tmp/pay3/profiles/node_modules/@koromix/koffi-linux-x64 \
            /tmp/pay3/profiles/node_modules/@img/sharp-linux-x64 \
            /tmp/pay3/profiles/node_modules/node-addon-require-builtin-linux-x64-gnu \
            /tmp/pay3/profiles/node_modules/sherpa-onnx-linux-x64 \
            /tmp/pay3/profiles/node_modules/node-pty/prebuilds/linux-x64 \
            /tmp/pay3/profiles/node_modules/node-pty/prebuilds/darwin-arm64 \
            /tmp/pay3/profiles/node_modules/node-pty/prebuilds/darwin-x64 \
            /tmp/pay3/profiles/node_modules/node-pty/prebuilds/win32-arm64 \
            /tmp/pay3/profiles/node_modules/node-pty/prebuilds/win32-x64 || true
          rm -rf /tmp/pay3/stage /root/.npm 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          node -e "const p=require('/tmp/pay3/profiles/node_modules/@deepseek-ai/dsh/package.json'); if(p.version!=='0.1.7-alpha.1') throw new Error('pin mismatch: '+p.version); console.log('dsh pin OK:', p.version)"
          node -e "const fs=require('fs'); const hits=[]; const walk=d=>{for(const n of fs.readdirSync(d,{withFileTypes:true})){const p=d+'/'+n.name; if(n.isDirectory()){if(n.name==='node_modules'||!p.includes('node_modules')) walk(p);} else if(p.endsWith('.node')) hits.push(p);}}; walk('/tmp/pay3/profiles/node_modules/@deepseek-ai'); console.log('arm64 .node:', hits.filter(h=>h.includes('arm64')||h.includes('musl')).length, '/', hits.length); const bad=hits.filter(h=>h.includes('x64')&&!h.includes('arm64')); if(bad.length){console.log('X64 LEFTOVER:'); bad.slice(0,10).forEach(h=>console.log('  ',h)); throw new Error('x64 native leftover');} console.log('NATIVE ARCH OK: no x64 .node');"
      - name: Web profile skeleton
        run: |
          mkdir -p /tmp/pay3/profiles/web
          cat > /tmp/pay3/profiles/web/package.json << 'EOF'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": {
              "profile": {
                "bundles": [
                  "@deepseek-ai/dsh-base",
                  "@deepseek-ai/dsh-web-app"
                ],
                "patchReload": "live"
              }
            }
          }
          EOF
          printf '# dsh profile root — empty entry list, composed from bundles.\n[]\n' > /tmp/pay3/profiles/web/cordis.yml
          printf '# user patch layer (managed by app seed, do not pre-fill).\n[]\n' > /tmp/pay3/profiles/web/cordis.patch.yml
      - name: Zen adapter (stripped, pinned)
        run: |
          mkdir -p /tmp/pay3/bin
          cp "${GITHUB_WORKSPACE}/rootfs/zen-adapter.mjs" /tmp/pay3/bin/zen-adapter.mjs
          # Strip fallback key: public builds carry NO embedded key (R-07).
          python3 - << 'EOF'
          import re
          p = '/tmp/pay3/bin/zen-adapter.mjs'
          t = open(p).read()
          t2, n = re.subn(r'const FALLBACK_KEY = "[^"]*";', 'const FALLBACK_KEY = ""; // stripped for public builds: set key in app Settings', t)
          assert n == 1, f'FALLBACK pattern count={n}'
          assert 'sk-tyHdwr' not in t2, 'live key survived strip'
          open(p, 'w').write(t2)
          print('zen stripped OK')
          EOF
          sha256sum /tmp/pay3/bin/zen-adapter.mjs | tee /tmp/pay3/bin/zen-adapter.mjs.sha256
          node --check /tmp/pay3/bin/zen-adapter.mjs && echo ZEN_SYNTAX_OK
      - name: payload.json + pack
        run: |
          cat > /tmp/pay3/payload.json << 'EOF'
          {"payloadVersion": 3, "dshVersion": "0.1.7-alpha.1", "profile": "web", "minApkVersion": 1}
          EOF
          tar -C /tmp/pay3 -cJf /tmp/dsh-payload.tar.xz payload.json bin profiles
          ls -lh /tmp/dsh-payload.tar.xz
          sha256sum /tmp/dsh-payload.tar.xz | tee /tmp/dsh-payload.tar.xz.sha256
      - name: Verify payload
        run: |
          python3 - << 'EOF'
          import tarfile, json
          tf = tarfile.open('/tmp/dsh-payload.tar.xz', 'r:xz')
          names = tf.getnames()
          assert 'payload.json' in names, 'no payload.json at top'
          pj = json.loads(tf.extractfile('payload.json').read())
          assert pj['dshVersion'] == '0.1.7-alpha.1', pj
          assert pj['payloadVersion'] == 3, pj
          dsh = json.loads(tf.extractfile('profiles/node_modules/@deepseek-ai/dsh/package.json').read())
          assert dsh['version'] == '0.1.7-alpha.1', dsh['version']
          assert 'profiles/node_modules/@deepseek-ai/dsh-web-frontend/dist/index.html' in names, 'no web dist'
          bad = [n for n in names if n.endswith('.node') and 'x64' in n and 'arm64' not in n]
          assert not bad, f'x64 native leftover: {bad[:5]}'
          arm = [n for n in names if n.endswith('.node') and ('arm64' in n or 'musl' in n)]
          assert arm, 'no arm64 native at all'
          print('NATIVE ARCH OK:', len(arm), 'arm64 .node')
          zen = tf.extractfile('bin/zen-adapter.mjs').read().decode()
          assert 'sk-tyHdwr' not in zen, 'live key in payload'
          print('PAYLOAD VERIFY OK:', len(names), 'entries')
          EOF
      - name: Publish payload-3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=payload-3
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" /tmp/dsh-payload.tar.xz /tmp/dsh-payload.tar.xz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" /tmp/dsh-payload.tar.xz /tmp/dsh-payload.tar.xz.sha256 \
              --repo "$GITHUB_REPOSITORY" --title "DSH payload v3 (0.1.7-alpha.1, no embedded key)"
          fi
