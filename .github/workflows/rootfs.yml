name: rootfs
# Debian bookworm arm64 rootfs + Node 24 внутри (/opt/node/bin/node) + proot static.
# Релиз rootfs-bookworm-2. Ключей и токенов нет.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build slim Debian arm64 rootfs with Node inside
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static xz-utils
          sudo mkdir -p /tmp/rootfs
          sudo debootstrap --no-check-gpg --foreign --arch=arm64 --variant=minbase \
            --include=ca-certificates,debian-archive-keyring \
            --exclude=nano,ed bookworm /tmp/rootfs https://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static /tmp/rootfs/usr/bin/
          sudo chroot /tmp/rootfs /usr/bin/qemu-aarch64-static /bin/sh /debootstrap/debootstrap --second-stage
          sudo rm /tmp/rootfs/usr/bin/qemu-aarch64-static
          # Node 24 aarch64 внутрь rootfs (официальный tarball, sha из nodejs.org).
          NODEV=$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c "import json,sys; print([r['version'] for r in json.load(sys.stdin) if r['version'].startswith('v24.')][0])")
          echo "node $NODEV"
          curl -fsSL "https://nodejs.org/dist/$NODEV/node-$NODEV-linux-arm64.tar.xz" -o /tmp/node.tar.xz
          curl -fsSL "https://nodejs.org/dist/$NODEV/SHASUMS256.txt" -o /tmp/SHASUMS.txt
          (cd /tmp && grep "node-$NODEV-linux-arm64.tar.xz" SHASUMS.txt | sha256sum -c -)
          sudo mkdir -p /tmp/rootfs/opt
          sudo tar -C /tmp/rootfs/opt -xJf /tmp/node.tar.xz
          sudo ln -sfn "$(ls -d /tmp/rootfs/opt/node-v* | head -n 1 | xargs basename)" /tmp/rootfs/opt/node
          sudo chroot /tmp/rootfs /usr/bin/qemu-aarch64-static /opt/node/bin/node --version || \
            sudo /tmp/rootfs/opt/node/bin/node --version 2>/dev/null || echo "node check via qemu skipped"
          # slim: docs, locales, caches
          sudo rm -rf /tmp/rootfs/usr/share/doc/* /tmp/rootfs/usr/share/man/* \
            /tmp/rootfs/var/cache/apt/archives/*.deb /tmp/rootfs/var/lib/apt/lists/*
          echo "nameserver 8.8.8.8" | sudo tee /tmp/rootfs/etc/resolv.conf
          sudo tar -C /tmp/rootfs -cJf /tmp/debian-rootfs.tar.xz .
          ls -lh /tmp/debian-rootfs.tar.xz
          sha256sum /tmp/debian-rootfs.tar.xz | tee /tmp/debian-rootfs.tar.xz.sha256
      - name: Fetch proot static binary (aarch64, Termux build)
        run: |
          sudo apt-get install -y -qq binutils
          python3 "${GITHUB_WORKSPACE}/rootfs/fetch_proot.py"
          ls -lh /tmp/proot
      - name: Publish rootfs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rootfs-bookworm-2
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" /tmp/debian-rootfs.tar.xz /tmp/debian-rootfs.tar.xz.sha256 /tmp/proot --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" /tmp/debian-rootfs.tar.xz /tmp/debian-rootfs.tar.xz.sha256 /tmp/proot \
              --repo "$GITHUB_REPOSITORY" --title "Debian bookworm rootfs + Node 24 + proot (arm64)"
          fi
